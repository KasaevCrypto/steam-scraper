name: Steam probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping Steam
        run: |
          curl -s -o out.json -w "HTTP %{http_code}\n" \
            -A "Mozilla/5.0" \
            "https://steamcommunity.com/market/search/render/?query=&start=0&count=10&appid=252490&norender=1"
          head -c 400 out.json
